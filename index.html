<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malik Danish Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

.welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(135deg, #10152f, #43206b);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.welcome-screen h1 {
    font-size: 35px;
    margin-bottom: 20px;
}

.welcome-screen p {
    font-size: 18px;
    margin-bottom: 25px;
}

.welcome-screen button {
    padding: 14px 28px;
    background: #725cff;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}

header {
    padding: 25px;
    text-align: center;
    background: #151c35;
}

main {
    padding: 50px 20px;
    text-align: center;
}

main h2 {
    margin-bottom: 15px;
    color: #a99cff;
}

footer {
    padding: 20px;
    text-align: center;
    color: #aaa;
}
</style>
</head>

<body>

<div class="welcome-screen" id="welcome-screen">
    <h1>Welcome to Malik Danish Website</h1>
    <p>Welcome! خوش آمدید ❤️</p>
    <button onclick="document.getElementById('welcome-screen').remove()">
        Explore Website
    </button>
</div>

<header>
    <h1>Malik Danish Website</h1>
</header>

<main>
    <h2>Welcome to My Website</h2>
    <p>This is my official website.</p>
</main>

<footer>
    © 2026 Malik Danish Website
</footer>

</body>
</html>
