
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malik Danish | Tools Directory</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f4f7ff}
header{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#171b3d,#092b3c)}
h1{color:#61f4dc;margin-bottom:8px}
p{color:#c2cbe0}
a{color:#61f4dc;text-decoration:none}
.home{display:inline-block;margin-top:12px;padding:10px 16px;border:1px solid #61f4dc;border-radius:9px}
main{max-width:1100px;margin:auto;padding:22px}
input,select{width:100%;padding:14px;margin:7px 0 15px;border-radius:10px;border:1px solid #35415e;background:#141b30;color:white;font-size:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#141b30;border:1px solid #283653;border-radius:14px;padding:18px}
.card h3{margin:0 0 8px}
.category{font-size:12px;color:#61f4dc}
.open{display:inline-block;margin-top:12px;background:#61f4dc;color:#07121b;padding:10px 14px;border-radius:8px;font-weight:bold}
footer{text-align:center;padding:25px;color:#9daac5}
</style>
</head>
<body>
<header>
<h1>Welcome to Malik Danish</h1>
<p>Discover useful websites, AI tools and online services</p>
<a class="home" href="index.html">← Back to Home</a>
</header>
<main>
<h2>Explore Online Tools</h2>
<input id="search" type="search" placeholder="Search tools or websites...">
<div class="filters">
<select id="category">
<option value="all">All Categories</option>
<option>AI</option><option>Design</option><option>Photo & Video</option>
<option>Documents & PDF</option><option>Education</option>
<option>Coding</option><option>Downloads</option><option>Productivity</option>
</select>
<select id="sort">
<option value="name">Sort by Name</option>
</select>
</div>
<p id="count"></p>
<div class="grid" id="results"></div>
</main>
<footer>© Malik Danish | Tools Directory</footer>

const search=document.getElementById("search");
const category=document.getElementById("category");
const results=document.getElementById("results");
const count=document.getElementById("count");
function render(){
 const q=search.value.toLowerCase().trim();
 const c=category.value;
 const filtered=tools.filter(t=>
  (t[0].toLowerCase().includes(q)||t[1].toLowerCase().includes(q)) &&
  (c==="all"||t[1]===c)
 ).sort((a,b)=>a[0].trim().localeCompare(b[0].trim()));
 count.textContent=filtered.length+" websites found";
 results.innerHTML="";
 filtered.forEach(t=>{
  const card=document.createElement("article");
  card.className="card";
  const h=document.createElement("h3");h.textContent=t[0].trim();
  const cat=document.createElement("div");cat.className="category";cat.textContent=t[1];
  const a=document.createElement("a");a.className="open";a.href=t[2];a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open Website ↗";
  card.append(h,cat,a);results.appendChild(card);
 });
}
search.addEventListener("input",render);
category.addEventListener("change",render);
render();
